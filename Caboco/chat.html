<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style.css">
    <title>Chat</title>
</head>

<body>
    <div class="pagina-flex">

        <div class="chat-container">

            <aside class="chat-sidebar">
                <h2>Conversas</h2>
                <ul>
                    <li><a href="chat.html">Dúvida sobre matrículas</a></li>
                    <li><a href="chat.html">Ajuda com o trabalho</a></li>
                    <li><a href="chat.html">Horários da biblioteca</a></li>
                </ul>
            </aside>

            <main class="chat">

                <div class="mensagens">
                    <div class="balao bot">Olá! Como posso ajudar você hoje?</div>
                    <div class="balao usuario">Oi! Quais são os horários da biblioteca?</div>
                    <div class="balao bot">A biblioteca abre de segunda a sexta, das 8h às 22h.</div>
                    <div class="balao usuario">Obrigado!</div>
                    <div class="balao bot">De nada! Posso ajudar em mais alguma coisa?</div>
                </div>

                <form action="#" method="post">
                    <input type="text" name="mensagem" placeholder="Digite sua mensagem..." autocomplete="off" required>
                    <button type="submit">Enviar</button>
                </form>

            </main>
        </div>
    </div>
</body>
</html>
